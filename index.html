<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Status</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#6b7280;--line:#e5e7eb;--ok:#2ea44f;--warn:#e3a008;--bad:#d9362b;--none:#d1d5db}
  @media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--text:#e8eaed;--muted:#9aa1ad;--line:#262b35;--none:#2c313c}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  main{max-width:760px;margin:0 auto;padding:40px 16px 64px}
  h1{font-size:22px;margin:0 0 20px}
  .banner{padding:20px 24px;border-radius:10px;color:#fff;font-size:18px;font-weight:600;background:var(--none)}
  .banner.ok{background:var(--ok)}.banner.warn{background:var(--warn)}.banner.bad{background:var(--bad)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:24px}
  .svc{padding:18px 22px;border-bottom:1px solid var(--line)}
  .svc:last-child{border:0}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .name{font-weight:600}.name a{color:inherit;text-decoration:none}.name a:hover{text-decoration:underline}
  .state{font-size:13px;font-weight:600;color:var(--muted)}
  .state.ok{color:var(--ok)}.state.warn{color:var(--warn)}.state.bad{color:var(--bad)}
  .bars{display:flex;gap:2px;margin:12px 0 6px;height:32px}
  .bar{flex:1;border-radius:2px;background:var(--none);position:relative}
  .bar.ok{background:var(--ok)}.bar.warn{background:var(--warn)}.bar.bad{background:var(--bad)}
  .bar:hover{opacity:.7}
  .bar:hover::after{content:attr(data-tip);position:absolute;bottom:38px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:4px 8px;border-radius:6px;font-size:12px;white-space:nowrap;z-index:2;pointer-events:none}
  .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .meta{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1 id="title">System Status</h1>
  <div id="banner" class="banner">Checking…</div>
  <div id="list" class="card"></div>
  <div class="meta" id="meta"></div>
</main>
<script>
const DAYS = 90;
const SLOW_MS = 3000;
const label = { ok: "Operational", warn: "Degraded", bad: "Down" };

function dayClass(d) {
  if (!d || !d.total) return "";
  const up = d.ok / d.total;
  if (up >= 0.995 && d.slow / d.total < 0.05) return "ok";
  return up >= 0.95 ? "warn" : "bad";
}

async function load() {
  const [cfg, data] = await Promise.all([
    fetch("config.json", { cache: "no-store" }).then(r => r.json()),
    fetch("data/status.json", { cache: "no-store" }).then(r => r.json()).catch(() => ({ services: {} })),
  ]);
  document.getElementById("title").textContent = cfg.title;
  document.title = cfg.title;

  const keys = [...Array(DAYS)].map((_, i) =>
    new Date(Date.now() - (DAYS - 1 - i) * 864e5).toISOString().slice(0, 10));
  let up = 0, known = 0;

  document.getElementById("list").innerHTML = cfg.services.map(svc => {
    const s = data.services[svc.id] || { days: {} };
    const cur = s.current;
    let st = "";
    if (cur) {
      known++;
      st = !cur.ok ? "bad" : cur.ms > SLOW_MS ? "warn" : "ok";
      if (st !== "bad") up++;
    }
    let tot = 0, okc = 0;
    const bars = keys.map(k => {
      const d = s.days[k];
      if (d) { tot += d.total; okc += d.ok; }
      const tip = d ? `${k}: ${(100 * d.ok / d.total).toFixed(2)}% uptime` : `${k}: no data`;
      return `<div class="bar ${dayClass(d)}" data-tip="${tip}"></div>`;
    }).join("");
    const pct = tot ? (100 * okc / tot).toFixed(2) + "% uptime" : "no data";
    return `<div class="svc">
      <div class="top">
        <span class="name"><a href="${svc.url}" target="_blank" rel="noopener">${svc.name}</a></span>
        <span class="state ${st}">${st ? label[st] : "Unknown"}${cur ? " · " + cur.ms + "ms" : ""}</span>
      </div>
      <div class="bars">${bars}</div>
      <div class="foot"><span>${DAYS} days ago</span><span>${pct}</span><span>Today</span></div>
    </div>`;
  }).join("");

  const b = document.getElementById("banner");
  const n = cfg.services.length;
  if (!known) { b.className = "banner"; b.textContent = "No data yet"; }
  else if (up === n) { b.className = "banner ok"; b.textContent = "All Systems Operational"; }
  else if (up === 0) { b.className = "banner bad"; b.textContent = "Major Outage"; }
  else { b.className = "banner warn"; b.textContent = "Partial System Outage"; }
  document.getElementById("meta").textContent =
    data.updated ? "Last checked " + new Date(data.updated).toLocaleString() : "";
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
